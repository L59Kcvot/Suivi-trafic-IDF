name: Collecte des incidents IDFM

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer la collecte
        env:
          IDFM_API_KEY: ${{ secrets.IDFM_API_KEY }}
        run: python scripts/collect_incidents.py

      - name: Committer les changements
        run: |
          git config user.name "idfm-bot"
          git config user.email "idfm-bot@users.noreply.github.com"
          git add data/incidents.json
          git diff --quiet --cached || git commit -m "chore: mise à jour des incidents ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          git push
